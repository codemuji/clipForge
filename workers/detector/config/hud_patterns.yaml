# HUD Text Detection Configuration
# Configures crop regions and matching patterns per game profile

default_profile: "default"

profiles:
  default:
    crop_regions:
      - name: "top_banner"
        # Normalized coordinates [x_min, y_min, x_max, y_max] in [0.0, 1.0]
        box: [0.20, 0.05, 0.80, 0.35]
      - name: "center"
        box: [0.20, 0.35, 0.80, 0.65]
    patterns:
      - pattern: "VICTORY ROYALE"
        weight: 1.00
      - pattern: "VICTORY"
        weight: 0.90
      - pattern: "DEFEAT"
        weight: 0.70
      - pattern: "FIRST BLOOD"
        weight: 0.85
      - pattern: "ACE"
        weight: 0.90
      - pattern: "OVERTIME"
        weight: 0.75
      - pattern: "ELIMINATED"
        weight: 0.70
      - pattern: "CHAMPION"
        weight: 0.95

  fortnite:
    crop_regions:
      - name: "top_banner"
        box: [0.20, 0.08, 0.80, 0.30]
    patterns:
      - pattern: "VICTORY ROYALE"
        weight: 1.00
      - pattern: "#1 VICTORY ROYALE"
        weight: 1.00
      - pattern: "VICTORY"
        weight: 0.90
      - pattern: "ELIMINATED"
        weight: 0.70

  valorant:
    crop_regions:
      - name: "round_end"
        box: [0.25, 0.12, 0.75, 0.38]
    patterns:
      - pattern: "VICTORY"
        weight: 0.95
      - pattern: "DEFEAT"
        weight: 0.70
      - pattern: "CLUTCH"
        weight: 0.90
      - pattern: "ACE"
        weight: 0.95
      - pattern: "MATCH POINT"
        weight: 0.80
