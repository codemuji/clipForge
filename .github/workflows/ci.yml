name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'lane/*'

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run lint
        run: |
          if [ -f Makefile ]; then
            make lint
          else
            echo "No Makefile yet (pending A-01); passing"
          fi

  unit:
    name: ci/unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: |
          if [ -f Makefile ]; then
            make test
          else
            echo "No Makefile yet (pending A-01); passing"
          fi

  integration:
    name: ci/integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run fixture integration tests
        run: |
          if [ -f Makefile ]; then
            make test:fixtures
          else
            echo "No Makefile yet (pending A-01); passing"
          fi
